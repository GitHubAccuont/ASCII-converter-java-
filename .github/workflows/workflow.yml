name: Some CI
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: 8
          distribution: 'temurin'
          cache: 'maven'

      - name: Build jar with maven
        run: |
          chmod +x mvnw
          ./mvnw -B package --file pom.xml

      - name: Publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-jar
          path: target/*.jar


  build-exe:
    needs: build-jar
    runs-on: windows-latest
    steps:

      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Load artifact from java building step;
        uses: actions/download-artifact@v7
        with:
          name: artifact-jar
          path: target/

      - name: Clean folder for jpackage
        run: |
          mkdir target\jpackage-input
          copy target\*.jar target\jpackage-input\

      - name: Make Jpackage exe file
        run: |
          jpackage --type app-image `
          --input target/jpackage-input `
          --dest target `
          --name "AsciiConverter" `
          --main-jar image-to-ascii.jar `
          --main-class org.example.Main

      - name: Archive the result
        run: |
          Compress-Archive -Path target\AsciiConverter -DestinationPath target\AsciiConverter-Windows.zip

      - name: Publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-exe-archive
          path: target/AsciiConverter-Windows.zip

  drop-release:
    runs-on: ubuntu-latest
    needs:
      - build-jar
      - build-exe
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v7
        with:
          name: artifact-jar
          path: release-assets/

      - name: Download EXE
        uses: actions/download-artifact@v7
        with:
          name: artifact-exe-archive
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*